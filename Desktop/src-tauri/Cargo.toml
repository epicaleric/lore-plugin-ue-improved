[package]
name = "lore-desktop"
version = "0.1.3"
description = "Desktop app for Lore: servers, projects, access and updates"
authors = ["epicaleric"]
edition = "2021"
license = "MIT"

[lib]
name = "lore_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "fs", "time", "io-util", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "stream"] }
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true


[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
